            setupDragAndDrop() {
                // Image Drop Zone
                const imgZone = document.getElementById('imageDropZone');
                if (imgZone) {
                    ['dragenter', 'dragover'].forEach(name => {
                        imgZone.addEventListener(name, (e) => { e.preventDefault(); imgZone.classList.add('dragover'); });
                    });
                    ['dragleave', 'drop'].forEach(name => {
                        imgZone.addEventListener(name, (e) => { e.preventDefault(); imgZone.classList.remove('dragover'); });
                    });
                    imgZone.addEventListener('drop', (e) => {
                        const files = e.dataTransfer.files;
                        if (files.length > 0) {
                            const input = document.getElementById('postImageFile');
                            input.files = files;
                            this.handleImageFile(input);
                        }
                    });
                }

                // Video Drop Zone
                const vidZone = document.getElementById('videoDropZone');
                if (vidZone) {
                    ['dragenter', 'dragover'].forEach(name => {
                        vidZone.addEventListener(name, (e) => { e.preventDefault(); vidZone.classList.add('dragover'); });
                    });
                    ['dragleave', 'drop'].forEach(name => {
                        vidZone.addEventListener(name, (e) => { e.preventDefault(); vidZone.classList.remove('dragover'); });
                    });
                    vidZone.addEventListener('drop', (e) => {
                        const files = e.dataTransfer.files;
                        if (files.length > 0) {
                            const input = document.getElementById('postVideoFile');
                            input.files = files;
                            this.handleVideoFile(input);
                        }
                    });
                }
            }

            handleImageFile(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    document.getElementById('postImage').value = base64;
                    const preview = document.getElementById('imagePreview');
                    const img = document.getElementById('imagePreviewImg');
                    if (preview && img) {
                        img.src = base64;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }

            clearImage() {
                document.getElementById('postImage').value = '';
                const input = document.getElementById('postImageFile');
                if (input) input.value = '';
                const preview = document.getElementById('imagePreview');
                if (preview) preview.style.display = 'none';
            }

            handleVideoFile(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    document.getElementById('postVideo').value = base64;
                    if (document.getElementById('postVideoUrl')) document.getElementById('postVideoUrl').value = '';
                    const preview = document.getElementById('videoPreview');
                    const videoEl = document.getElementById('videoPreviewEl');
                    if (preview && videoEl) {
                        videoEl.src = base64;
                        preview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }

            clearVideo() {
                document.getElementById('postVideo').value = '';
                const urlInput = document.getElementById('postVideoUrl');
                if (urlInput) urlInput.value = '';
                const fileInput = document.getElementById('postVideoFile');
                if (fileInput) fileInput.value = '';
                const preview = document.getElementById('videoPreview');
                const videoEl = document.getElementById('videoPreviewEl');
                if (videoEl) {
                    videoEl.pause();
                    videoEl.removeAttribute('src');
                    videoEl.load();
                }
                if (preview) preview.style.display = 'none';
            }

            handleVideoUrlInput(url) {
                const trimmed = url.trim();
                document.getElementById('postVideo').value = trimmed;
                const preview = document.getElementById('videoPreview');
                const videoEl = document.getElementById('videoPreviewEl');
                if (!trimmed) {
                    if (preview) preview.style.display = 'none';
                    return;
                }
                if (trimmed.endsWith('.mp4') || trimmed.endsWith('.webm') || trimmed.startsWith('/uploads/')) {
                    if (preview && videoEl) {
                        videoEl.src = trimmed;
                        preview.style.display = 'block';
                    }
                } else {
                    if (preview) preview.style.display = 'none';
                }
            }

            insertFormat(startTag, endTag) {
                const textarea = document.getElementById('postBody');
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const sel = textarea.value.substring(start, end);
                const replacement = startTag + (sel || 'matn') + endTag;
                textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
                textarea.focus();
                textarea.setSelectionRange(start + startTag.length, start + startTag.length + (sel.length || 4));
            }

            focusAdminForm() {
                if (!this.isAdmin) {
                    this.openLoginModal();
                    return;
                }
                const widget = document.getElementById('adminWidget');
                if (widget) {
                    window.scrollTo({ top: widget.offsetTop - 90, behavior: 'smooth' });
                    const titleInput = document.getElementById('postTitle');
                    if (titleInput) titleInput.focus();
                }
            }

            // --- POST CRUD ---
            async handlePostSubmit(e) {
                e.preventDefault();
                if (!this.isAdmin) return;

                const title = document.getElementById('postTitle').value.trim();
                const subtitle = document.getElementById('postSubtitle').value.trim();
                const category = document.getElementById('postCategory').value.trim();
                const tagsRaw = document.getElementById('postTags').value.trim();
                let image = document.getElementById('postImage').value.trim();
                let video = document.getElementById('postVideo').value.trim() || (document.getElementById('postVideoUrl') ? document.getElementById('postVideoUrl').value.trim() : '');
                const rawBody = document.getElementById('postBody').value.trim();

                if (!title || !rawBody) return;

                const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean) : [];
                const btn = document.getElementById('savePostBtn');
                btn.disabled = true;
                btn.textContent = 'Yuklanmoqda...';

                // If image is newly uploaded Base64, upload to server /api/upload
                if (image && image.startsWith('data:image/')) {
                    try {
                        const upRes = await fetch(this.getApiUrl('/api/upload'), {
                            method: 'POST',
                            headers: this.getAuthHeaders(),
                            body: JSON.stringify({ image })
                        });
                        const upData = await upRes.json();
                        if (upData.status === 'success' && upData.url) {
                            image = upData.url;
                        }
                    } catch (ue) {
                        console.error('Image upload fallback to inline', ue);
                    }
                }

                // If video is newly uploaded Base64, upload to server /api/upload
                if (video && video.startsWith('data:video/')) {
                    try {
                        const vRes = await fetch(this.getApiUrl('/api/upload'), {
                            method: 'POST',
                            headers: this.getAuthHeaders(),
                            body: JSON.stringify({ video })
                        });
                        const vData = await vRes.json();
                        if (vData.status === 'success' && vData.url) {
                            video = vData.url;
                        }
                    } catch (ve) {
                        console.error('Video upload fallback to inline', ve);
                    }
                }

                if (this.editingPostId !== null) {
                    const postIndex = this.posts.findIndex(p => p.id === this.editingPostId);
                    if (postIndex !== -1) {
                        this.posts[postIndex].title = title;
                        this.posts[postIndex].subtitle = subtitle;
                        this.posts[postIndex].category = category;
                        this.posts[postIndex].tags = tags;
                        this.posts[postIndex].image = image;
                        this.posts[postIndex].video = video;
                        this.posts[postIndex].body = this.formatBody(rawBody);
                        this.posts[postIndex].rawBody = rawBody;
                        this.posts[postIndex].updated_at = new Date().toISOString();
                        this.showToast('✅ Post yangilandi!');
                    }
                    this.editingPostId = null;
                } else {
                    const newPost = {
                        id: Date.now(),
                        title,
                        subtitle,
                        category,
                        tags,
                        image,
                        video,
                        body: this.formatBody(rawBody),
                        rawBody,
                        date: new Date().toISOString(),
                        views: 0,
                        likes: 0
                    };
                    this.posts.unshift(newPost);
                    this.showToast('🚀 Yangi post muvaffaqiyatli chop etildi!');
                }

                this.savePostsToServer();
                this.renderAdminWidget();
                this.renderPosts();
                this.renderCategories();
                this.updateStats();
            }

            editPost(id, event) {
                if (event) event.stopPropagation();
                if (!this.isAdmin) return;
                const post = this.posts.find(p => p.id === id);
                if (!post) return;

                this.editingPostId = id;
                this.closeModal();
                this.renderAdminWidget();

                document.getElementById('postTitle').value = post.title || '';
                document.getElementById('postSubtitle').value = post.subtitle || '';
                document.getElementById('postCategory').value = post.category || '';
                document.getElementById('postTags').value = (post.tags || []).join(', ');
                document.getElementById('postImage').value = post.image || '';
                document.getElementById('postVideo').value = post.video || '';
                if (document.getElementById('postVideoUrl')) document.getElementById('postVideoUrl').value = post.video || '';
                document.getElementById('postBody').value = post.rawBody || this.stripHtml(post.body);

                if (post.image) {
                    const preview = document.getElementById('imagePreview');
                    const img = document.getElementById('imagePreviewImg');
                    if (preview && img) {
                        img.src = post.image;
                        preview.style.display = 'block';
                    }
                }

                if (post.video) {
                    const preview = document.getElementById('videoPreview');
                    const videoEl = document.getElementById('videoPreviewEl');
                    if (preview && videoEl && (post.video.endsWith('.mp4') || post.video.endsWith('.webm') || post.video.startsWith('/uploads/'))) {
                        videoEl.src = post.video;
                        preview.style.display = 'block';
                    }
                }
                this.focusAdminForm();
            }

            cancelEdit() {
                this.editingPostId = null;
                this.renderAdminWidget();
            }

            deletePost(id, event) {
                if (event) event.stopPropagation();
                if (!this.isAdmin) return;
                const post = this.posts.find(p => p.id === id);
                if (!post) return;

                this.postToDeleteId = id;
                const modal = document.getElementById('deleteConfirmModal');
                const text = document.getElementById('deleteConfirmText');
                if (text) text.textContent = `"${post.title}" maqolasini o'chirib tashlashni tasdiqlaysizmi?`;
                if (modal) modal.classList.add('active');
            }

            closeDeleteModal(e) {
                if (e && e.target !== e.currentTarget) return;
                document.getElementById('deleteConfirmModal').classList.remove('active');
                this.postToDeleteId = null;
            }

            executeDelete() {
                if (!this.postToDeleteId || !this.isAdmin) return;
                const id = this.postToDeleteId;
                this.posts = this.posts.filter(p => p.id !== id);
                delete this.likes[id];
                this.bookmarks = this.bookmarks.filter(b => b !== id);
                localStorage.setItem('kenjayev_bookmarks', JSON.stringify(this.bookmarks));

                this.savePostsToServer();
                this.closeDeleteModal();
                this.closeModal();

                if (this.editingPostId === id) this.editingPostId = null;
                this.renderAdminWidget();
                this.renderPosts();
                this.renderCategories();
                this.updateStats();
                this.showToast('🗑️ Post o\'chirib tashlandi');
            }

            savePostsToServer() {
                localStorage.setItem('problog_posts', JSON.stringify(this.posts));
                fetch(this.getApiUrl('/api/save'), {
                    method: 'POST',
                    headers: this.getAuthHeaders(),
                    body: JSON.stringify({
                        posts: this.posts,
                        categories: this.getUniqueCategories()
                    })
                }).catch(err => console.log('Serverga saqlashda xato', err));
            }

            // --- FORMATTING & SANITIZATION ---
            formatVideoEmbed(videoUrl, poster = '') {
                if (!videoUrl) return '';
                const trimmed = videoUrl.trim();

                // YouTube link match (standard, youtu.be, embed, shorts)
                const ytMatch = trimmed.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
                if (ytMatch && ytMatch[1]) {
                    const videoId = ytMatch[1];
                    return `
                        <div class="video-container">
                            <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                        </div>
                    `;
                }

                // Vimeo link match
                const vimeoMatch = trimmed.match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/([^\/]*)\/videos\/|album\/(\d+)\/video\/|video\/|)(\d+)/);
                if (vimeoMatch && vimeoMatch[3]) {
                    return `
                        <div class="video-container">
                            <iframe src="https://player.vimeo.com/video/${vimeoMatch[3]}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    `;
                }

                // Direct video file (local upload /uploads/... or remote mp4/webm/mov)
                return `
                    <div class="video-container">
                        <video controls playsinline preload="metadata" poster="${poster || ''}">
                            <source src="${trimmed}">
                            Brauzeringiz videoni qo'llab-quvvatlamaydi.
                        </video>
                    </div>
                `;
            }

            getYouTubeId(url) {
                if (!url) return null;
                const match = url.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
                return match ? match[1] : null;
            }

            formatBody(text) {
                // Headings
                let formatted = text
                    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                    .replace(/^# (.*$)/gim, '<h2>$1</h2>')
                    .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
                    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                    .replace(/`([^`]+)`/gim, '<code>$1</code>')
                    .replace(/(https?:\/\/[^\s<]+)/gim, '<a href="$1" target="_blank" rel="noopener">$1</a>');

                const paragraphs = formatted.split('\n\n').filter(p => p.trim());
                return paragraphs.map(p => {
                    if (p.startsWith('<h') || p.startsWith('<blockquote') || p.startsWith('<pre')) return p;
                    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
                }).join('');
            }

            calculateReadingTime(text) {
                const words = this.stripHtml(text).trim().split(/\s+/).length;
                const minutes = Math.ceil(words / 180);
                return `${minutes} daqiqa o'qish`;
            }

            // --- POST RENDERING & FILTERING ---
            renderPosts() {
                const grid = document.getElementById('postsGrid');
                let filtered = this.posts;

                // Category Filter
                if (this.currentFilter === 'bookmarks') {
                    filtered = filtered.filter(p => this.bookmarks.includes(p.id));
                } else if (this.currentFilter !== 'all') {
                    filtered = filtered.filter(p => p.category === this.currentFilter);
                }

                // Search Query Filter
                if (this.searchQuery) {
                    const q = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(p => {
                        return (p.title && p.title.toLowerCase().includes(q)) ||
                               (p.subtitle && p.subtitle.toLowerCase().includes(q)) ||
                               (p.category && p.category.toLowerCase().includes(q)) ||
                               (p.rawBody && p.rawBody.toLowerCase().includes(q)) ||
                               (p.tags && p.tags.some(t => t.toLowerCase().includes(q)));
                    });
                }

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <h3>Maqolalar topilmadi</h3>
                            <p>${this.searchQuery ? `"${this.searchQuery}" bo'yicha hech narsa topilmadi.` : (this.isAdmin ? "Birinchi maqolangizni joylash uchun formani to'ldiring." : "Hozircha maqolalar mavjud emas.")}</p>
                            ${this.searchQuery ? `<button class="btn btn-ghost btn-sm" onclick="app.clearSearch()" style="margin-top:12px;">Qidiruvni tozalash</button>` : ''}
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = filtered.map((post, index) => {
                    const date = new Date(post.date).toLocaleDateString('uz-UZ', { year: 'numeric', month: 'short', day: 'numeric' });
                    const isLiked = this.likes[post.id];
                    const isBookmarked = this.bookmarks.includes(post.id);
                    const readingTime = this.calculateReadingTime(post.rawBody || post.body || '');
                    const ytId = this.getYouTubeId(post.video);
                    const cardImage = post.image || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');

                    return `
                        <article class="post-card" onclick="app.openPost(${post.id})">
                            <div class="post-image-wrap">
                                ${cardImage 
                                    ? `<img src="${cardImage}" alt="${post.title}" class="post-image" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'post-image-placeholder\\'>${post.video ? '🎬' : '📝'}</div>'">`
                                    : `<div class="post-image-placeholder">${post.video ? '🎬' : '📝'}</div>`
                                }
                                ${post.video ? `
                                    <div class="post-video-badge">
                                        <span class="post-video-badge-icon">▶</span> Video
                                    </div>
                                ` : ''}
                                <button class="post-bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="app.toggleBookmark(${post.id}, event)" title="${isBookmarked ? 'Saqlanganlardan o\'chirish' : 'Saqlab qo\'yish'}">
                                    ${isBookmarked ? '★' : '☆'}
                                </button>
                            </div>
                            <div class="post-content">
                                <div class="post-meta">
                                    <span class="post-category">${post.category}</span>
                                    <span>•</span>
                                    <span>${date}</span>
                                    <span>•</span>
                                    <span class="post-reading-time">⏱ ${readingTime}</span>
                                </div>
                                <h3 class="post-title">${post.title}</h3>
                                <div class="post-excerpt">${post.subtitle || this.stripHtml(post.body).substring(0, 110) + '...'}</div>
                                ${post.tags && post.tags.length > 0 ? `
                                    <div class="post-tags">
                                        ${post.tags.map(t => `<span class="post-tag-chip">#${t}</span>`).join('')}
                                    </div>
                                ` : ''}
                                <div class="post-footer">
                                    <div class="post-stats">
                                        <span class="post-stat">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            ${this.formatNumber(post.views || 0)}
                                        </span>
                                        <span class="post-stat ${isLiked ? 'liked' : ''}">
                                            <svg width="15" height="15" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                            ${this.formatNumber(post.likes || 0)}
                                        </span>
                                    </div>
                                    ${this.isAdmin ? `
                                        <div class="admin-controls">
                                            <button class="icon-btn" onclick="app.editPost(${post.id}, event)" title="Tahrirlash">✏️</button>
                                            <button class="icon-btn danger" onclick="app.deletePost(${post.id}, event)" title="O'chirish">🗑️</button>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            }

            // --- CATEGORIES & SEARCH ---
            getUniqueCategories() {
                const cats = this.posts.map(p => p.category).filter(Boolean);
                return [...new Set(cats)];
            }

            renderCategories() {
                const tagList = document.getElementById('tagList');
                if (!tagList) return;
                const cats = this.getUniqueCategories();
                tagList.innerHTML = `
                    <span class="tag ${this.currentFilter === 'all' ? 'active' : ''}" onclick="app.filterCategory('all')">Barchasi</span>
                    <span class="tag ${this.currentFilter === 'bookmarks' ? 'active' : ''}" onclick="app.filterCategory('bookmarks')">⭐ Saqlanganlar (${this.bookmarks.length})</span>
                    ${cats.map(cat => `
                        <span class="tag ${this.currentFilter === cat ? 'active' : ''}" onclick="app.filterCategory('${cat}')">${cat}</span>
                    `).join('')}
                `;
            }

            filterCategory(cat) {
                this.currentFilter = cat;
                this.renderCategories();
                this.renderPosts();
            }

            handleSearch(val) {
                this.searchQuery = val.trim();
                const clearBtn = document.getElementById('searchClear');
                if (clearBtn) clearBtn.style.display = this.searchQuery ? 'block' : 'none';
                this.renderPosts();
            }

            clearSearch() {
                const input = document.getElementById('globalSearch');
                if (input) input.value = '';
                this.handleSearch('');
            }

            // --- POST DETAIL & ARTICLE EXPERIENCE ---
            openPost(id, triggerView = true) {
                const post = this.posts.find(p => p.id === id);
                if (!post) return;

                this.currentOpenPostId = id;
                const isLiked = this.likes[id];
                const isBookmarked = this.bookmarks.includes(id);
                const date = new Date(post.date).toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' });
                const readingTime = this.calculateReadingTime(post.rawBody || post.body || '');

                // Smart View Trigger
                if (triggerView) {
                    fetch(this.getApiUrl('/api/view'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ postId: id })
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.status === 'success' && typeof res.views === 'number') {
                            post.views = res.views;
                            this.updateStats();
                        }
                    })
                    .catch(() => {});
                }

                // Related Posts
                const related = this.posts.filter(p => p.id !== id && (p.category === post.category || (p.tags && post.tags && p.tags.some(t => post.tags.includes(t))))).slice(0, 3);

                // Update Dynamic SEO & Social tags
                document.title = `${post.title} | Kenjayev BLOG`;
                const ogTitle = document.getElementById('ogTitle');
                const ogDesc = document.getElementById('ogDesc');
                if (ogTitle) ogTitle.content = post.title;
                if (ogDesc) ogDesc.content = post.subtitle || this.stripHtml(post.body).substring(0, 150);

                const modalBody = document.getElementById('modalBody');
                const mediaHtml = post.video 
                    ? this.formatVideoEmbed(post.video, post.image)
                    : (post.image ? `<img src="${post.image}" alt="${post.title}" class="post-detail-image" onerror="this.style.display='none'">` : '');

                modalBody.innerHTML = `
                    <div class="post-detail-header">
                        <div class="post-meta" style="margin-bottom: 12px;">
                            <span class="post-category">${post.category}</span>
                            <span>•</span>
                            <span>${date}</span>
                            <span>•</span>
                            <span>⏱ ${readingTime}</span>
                        </div>
                        <h1 class="post-detail-title">${post.title}</h1>
                        <div class="post-detail-meta">
                            <span>👁 ${this.formatNumber(post.views || 0)} ko'rish</span>
                            <span>❤️ ${this.formatNumber(post.likes || 0)} layk</span>
                        </div>
                    </div>

                    ${mediaHtml}

                    <div class="post-detail-body">${post.body}</div>

                    <div class="post-detail-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="app.toggleLike(${id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            ${isLiked ? 'Layk bosilgan' : 'Layk bosish'}
                        </button>
                        <button class="action-btn" onclick="app.toggleBookmark(${id})">
                            ${isBookmarked ? '★ Saqlangan' : '☆ Saqlash'}
                        </button>
                        <button class="action-btn" onclick="app.shareTelegram(${id})">
                            ✈️ Telegram
                        </button>
                        <button class="action-btn" onclick="app.shareWhatsApp(${id})">
                            💬 WhatsApp
                        </button>
                        <button class="action-btn" onclick="app.shareNative(${id})">
                            🔗 Ulashish
                        </button>
                        <button class="action-btn" onclick="app.copyLink(${id})">
                            📋 Nusxa
                        </button>
                        ${this.isAdmin ? `
                            <button class="action-btn" onclick="app.editPost(${id})">✏️ Tahrirlash</button>
                            <button class="action-btn" onclick="app.deletePost(${id})" style="color:var(--danger); border-color:rgba(239,68,68,0.3);">🗑️ O'chirish</button>
                        ` : ''}
                    </div>

                    ${related.length > 0 ? `
                        <div class="related-section">
                            <div class="related-title">O'xshash maqolalar</div>
                            <div class="related-grid">
                                ${related.map(rp => `
                                    <div class="related-card" onclick="app.openPost(${rp.id})">
                                        <div class="related-card-title">${rp.title}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;

                document.getElementById('postModal').classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            closeModal(e) {
                if (e && e.target !== e.currentTarget) return;
                document.getElementById('postModal').classList.remove('active');
                document.body.style.overflow = '';
                this.currentOpenPostId = null;
                document.title = "Kenjayev BLOG | Shaxsiy Fikrlar va G'oyalar";
            }

            // --- LIKES & BOOKMARKS ---
            toggleLike(id) {
                const alreadyLiked = !!this.likes[id];
                const action = alreadyLiked ? 'remove' : 'add';
                const post = this.posts.find(p => p.id === id);
                if (!post) return;

                // Optimistic UI update
                if (alreadyLiked) {
                    delete this.likes[id];
                    post.likes = Math.max(0, (post.likes || 0) - 1);
                    this.showToast('💔 Layk olib tashlandi');
                } else {
                    this.likes[id] = true;
                    post.likes = (post.likes || 0) + 1;
                    this.showToast('❤️ Layk bosildi!');
                }
                localStorage.setItem('problog_likes', JSON.stringify(this.likes));
                this.renderPosts();
                this.updateStats();

                if (document.getElementById('postModal').classList.contains('active')) {
                    this.openPost(id, false);
                }

                // Server Sync
                fetch(this.getApiUrl('/api/like'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId: id, action })
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success' && typeof res.likes === 'number') {
                        post.likes = res.likes;
                        this.renderPosts();
                        this.updateStats();
                        if (document.getElementById('postModal').classList.contains('active')) {
                            this.openPost(id, false);
                        }
                    }
                })
                .catch(() => {});
            }

            toggleBookmark(id, event) {
                if (event) event.stopPropagation();
                const index = this.bookmarks.indexOf(id);
                if (index === -1) {
                    this.bookmarks.push(id);
                    this.showToast('⭐ Maqola saqlanganlarga qo\'shildi!');
                } else {
                    this.bookmarks.splice(index, 1);
                    this.showToast('ℹ️ Saqlanganlardan olib tashlandi');
                }
                localStorage.setItem('kenjayev_bookmarks', JSON.stringify(this.bookmarks));
                this.renderCategories();
                this.renderPosts();
                if (document.getElementById('postModal').classList.contains('active') && this.currentOpenPostId === id) {
                    this.openPost(id, false);
                }
            }

            // --- SHARING ---
            getPostShareUrl(id) {
                return `${window.location.origin}/?post=${id}`;
            }

            shareTelegram(id) {
                const post = this.posts.find(p => p.id === id);
                if (!post) return;
                const url = encodeURIComponent(this.getPostShareUrl(id));
                const text = encodeURIComponent(`📌 ${post.title}\n\nKenjayev BLOG'da mutolaa qiling:`);
                window.open(`https://t.me/share/url?url=${url}&text=${text}`, '_blank');
            }

            shareWhatsApp(id) {
                const post = this.posts.find(p => p.id === id);
                if (!post) return;
                const text = encodeURIComponent(`📌 ${post.title}\n${this.getPostShareUrl(id)}`);
                window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            }

            shareNative(id) {
                const post = this.posts.find(p => p.id === id);
                if (!post) return;
                if (navigator.share) {
                    navigator.share({
                        title: post.title,
                        text: post.subtitle || this.stripHtml(post.body).substring(0, 100),
                        url: this.getPostShareUrl(id)
                    }).catch(() => {});
                } else {
                    this.copyLink(id);
                }
            }

            copyLink(id) {
                const url = this.getPostShareUrl(id);
                navigator.clipboard.writeText(url).then(() => {
                    this.showToast('🔗 Havola nusxalandi!');
                });
            }

            // --- CMS DASHBOARD MODAL ---
            openDashModal() {
                if (!this.isAdmin) return;
                const modal = document.getElementById('adminDashModal');
                const body = document.getElementById('dashModalBody');

                const totalViews = this.posts.reduce((s, p) => s + (p.views || 0), 0);
                const totalLikes = this.posts.reduce((s, p) => s + (p.likes || 0), 0);
                const cats = this.getUniqueCategories();
                const sortedByViews = [...this.posts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 5);

                body.innerHTML = `
                    <div class="dash-grid">
                        <div class="dash-card">
                            <div class="dash-val">${this.posts.length}</div>
                            <div class="dash-lbl">Jami Maqolalar</div>
                        </div>
                        <div class="dash-card">
                            <div class="dash-val">${totalViews}</div>
                            <div class="dash-lbl">Jami Ko'rishlar</div>
                        </div>
                        <div class="dash-card">
                            <div class="dash-val">${totalLikes}</div>
                            <div class="dash-lbl">Jami Layklar</div>
                        </div>
                        <div class="dash-card">
                            <div class="dash-val">${cats.length}</div>
                            <div class="dash-lbl">Kategoriyalar</div>
                        </div>
                    </div>

                    <h3 style="font-size:1rem;margin-bottom:12px;">🔥 Eng Ko'p O'qilgan Maqolalar (Top 5)</h3>
                    <div style="background:var(--surface-elevated);border-radius:var(--radius-sm);padding:12px;margin-bottom:24px;">
                        ${sortedByViews.map((p, idx) => `
                            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-subtle);">
                                <span style="font-size:0.9rem;font-weight:600;">${idx + 1}. ${p.title}</span>
                                <span style="font-size:0.85rem;color:var(--text-muted);">👁 ${p.views || 0} • ❤️ ${p.likes || 0}</span>
                            </div>
                        `).join('')}
                    </div>

                    <h3 style="font-size:1rem;margin-bottom:12px;">💾 Zaxira Nusxalari (Backups)</h3>
                    <div style="display:flex;gap:10px;margin-bottom:16px;">
                        <button class="btn btn-primary btn-sm" onclick="app.triggerBackup()">+ Yangi Zaxira Nusxa Yaratish</button>
                    </div>
                    <div id="backupListContainer" style="font-size:0.85rem;color:var(--text-secondary);">
                        Zaxira nusxalari yuklanmoqda...
                    </div>
                `;

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                this.loadBackupsList();
            }

            closeDashModal(e) {
                if (e && e.target !== e.currentTarget) return;
                document.getElementById('adminDashModal').classList.remove('active');
                document.body.style.overflow = '';
            }

            loadBackupsList() {
                fetch(this.getApiUrl('/api/admin/backups'), { headers: this.getAuthHeaders() })
                    .then(r => r.json())
                    .then(res => {
                        const container = document.getElementById('backupListContainer');
                        if (!container) return;
                        if (res.backups && res.backups.length > 0) {
                            container.innerHTML = res.backups.map(b => `
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-elevated);border-radius:6px;margin-bottom:6px;">
                                    <span>📄 ${b.filename} (${(b.size/1024).toFixed(1)} KB) — <small>${b.created_at}</small></span>
                                    <button class="btn btn-ghost btn-sm" onclick="app.restoreBackup('${b.filename}')">Tiklash</button>
                                </div>
                            `).join('');
                        } else {
                            container.innerHTML = "Hozircha qo'lda yaratilgan zaxira nusxalari yo'q.";
                        }
                    })
                    .catch(() => {});
            }

            triggerBackup() {
                fetch(this.getApiUrl('/api/admin/backup'), {
                    method: 'POST',
                    headers: this.getAuthHeaders()
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        this.showToast('✅ Zaxira nusxa yaratildi!');
                        this.loadBackupsList();
                    }
                })
                .catch(() => this.showToast('❌ Xatolik yuz berdi'));
            }

            restoreBackup(filename) {
                if (!confirm(`"${filename}" dan ma'lumotlarni tiklashni tasdiqlaysizmi?`)) return;
                fetch(this.getApiUrl('/api/admin/restore'), {
                    method: 'POST',
                    headers: this.getAuthHeaders(),
                    body: JSON.stringify({ filename })
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        this.showToast('✅ Ma\'lumotlar tiklandi!');
                        this.fetchServerData();
                        this.closeDashModal();
                    }
                })
                .catch(() => this.showToast('❌ Tiklashda xatolik'));
            }

            // --- HELPERS ---
            updateStats() {
                const totalPosts = this.posts.length;
                const totalViews = this.posts.reduce((s, p) => s + (p.views || 0), 0);
                const totalLikes = this.posts.reduce((s, p) => s + (p.likes || 0), 0);

                this.animateNumber('totalPosts', totalPosts);
                this.animateNumber('totalViews', totalViews);
                this.animateNumber('totalLikes', totalLikes);
            }

            animateNumber(id, target) {
                const el = document.getElementById(id);
                if (!el) return;
                const current = parseInt(el.textContent.replace(/,/g, '')) || 0;
                if (current === target) return;
                const duration = 500;
                const start = performance.now();
                const step = (now) => {
                    const progress = Math.min((now - start) / duration, 1);
                    const val = Math.floor(current + (target - current) * progress);
                    el.textContent = this.formatNumber(val);
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }

            formatNumber(num) {
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num.toString();
            }

            stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            showToast(message) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3500);
            }

            setupScrollEvents() {
                window.addEventListener('scroll', () => {
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
                    const prog = document.getElementById('readingProgress');
                    if (prog) prog.style.width = scrolled + '%';

                    const backBtn = document.getElementById('backToTop');
                    if (backBtn) {
                        if (winScroll > 300) backBtn.classList.add('visible');
                        else backBtn.classList.remove('visible');
                    }
                });
            }

            checkUrlPost() {
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('post');
                if (postId) {
                    const idNum = parseInt(postId);
                    if (idNum) setTimeout(() => this.openPost(idNum, true), 300);
                }
            }

            goHome() {
                this.currentFilter = 'all';
                this.clearSearch();
                this.renderCategories();
                this.renderPosts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            registerPWA() {
                if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                }
            }
        }

        const app = new BlogApp();
    </script>
</body>
</html>
