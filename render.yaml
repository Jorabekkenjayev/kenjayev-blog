services:
  - type: web
    name: kenjayev-blog
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_APP_URL
        value: "https://kenjayev-blog.onrender.com"
      - key: ADMIN_LOGIN
        value: "+998919705191"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SALT
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: GUARD_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: MAIN_BOT_USERNAME
        value: "KenjayevJorabekBot"
      - key: GUARD_BOT_USERNAME
        value: "Botlarni_tekshiruvchi_Bot"
